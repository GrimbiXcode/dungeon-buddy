# Beispiel-Deployment für Dungeon Buddy (App + PostgreSQL + S3 für Anhänge).
#
#   1. cp .env.example .env   und APP_SECRET + Telegram-Werte eintragen
#   2. POSTGRES_PASSWORD unten und in DATABASE_URL gleich setzen
#   3. docker compose up -d --build
#
# Die App spielt Datenbank-Migrationen beim Start automatisch ein.
#
# Anhänge (Bilder, PDFs) liegen in einem S3-Bucket. Hier übernimmt das
# SeaweedFS; in Produktion kann stattdessen ein gehosteter Dienst (z. B.
# Hetzner Object Storage) stehen – dann den Dienst "s3" weglassen und die
# S3_*-Variablen in .env setzen. Die Schlüssel unten (s3 und app) gleich
# setzen.
#
# Lokale Entwicklung ohne Container für App und DB: nur den Speicher starten
#   docker compose up -d s3
# und in .env die S3_*-Werte aus .env.example (Abschnitt SeaweedFS) eintragen.
# Davor gehört ein Reverse Proxy mit HTTPS (z. B. Caddy oder Traefik):
# Das Sitzungs-Cookie wird in Produktion nur über HTTPS gesendet.

services:
  db:
    # Gleiche Hauptversion wie auf Coolify; ein Wechsel braucht pg_dump/restore
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dungeonbuddy
      POSTGRES_USER: dungeonbuddy
      POSTGRES_PASSWORD: change-me
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: dungeon-buddy:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Überschreibt DATABASE_URL aus .env; Passwort wie POSTGRES_PASSWORD oben
      DATABASE_URL: postgres://dungeonbuddy:change-me@db:5432/dungeonbuddy
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: dungeon-buddy
      S3_ACCESS_KEY_ID: dungeonbuddy
      S3_SECRET_ACCESS_KEY: change-me-too
      S3_FORCE_PATH_STYLE: "1"
      S3_CREATE_BUCKET: "1"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  s3:
    # S3-kompatibler Speicher für Anhänge (Ersatz für das nicht mehr
    # gepflegte MinIO). Nur lokal erreichbar; die App spricht intern mit ihm.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333
    environment:
      # Daraus legt SeaweedFS eine Admin-Identität für S3 an
      AWS_ACCESS_KEY_ID: dungeonbuddy
      AWS_SECRET_ACCESS_KEY: change-me-too
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:8333:8333"

volumes:
  db-data:
  s3-data:
